# Audit Epoch AI's Chess Puzzles on Hawk.
#
# General: inspect_audit (the auditor cell, tools, grade, concordance, verdicts) and
# its published auditor image. Bespoke: this file and the epoch-bench task package.
# The auditor installs any tooling it decides it needs (the local pilot showed it
# reaching for stockfish + python-chess unprompted).
name: audit-epoch-chess

packages:
  - git+https://github.com/Generality-Labs/inspect_audit@grade-reset
  - git+https://github.com/Generality-Labs/epoch_bench

tasks:
  - package: git+https://github.com/Generality-Labs/inspect_audit@grade-reset
    name: inspect_audit
    items:
      - name: audit
        args:
          task: bench/Chess Puzzles
          # Epoch's 38 public logs; the manifest is fetched by the (trusted) runner
          logs: https://raw.githubusercontent.com/Generality-Labs/epoch_bench/main/audit/logs.csv
          items: [gold-answer, insufficiently-specified, answer-format, red-teaming, other-findings]
          auditor_image: ghcr.io/generality-labs/inspect-audit-auditor:0.2

# own OpenRouter key, straight to the provider, no middleman
models:
  - package: openai
    name: openai
    items:
      - name: openrouter/openai/gpt-5.6-luna
model_roles:
  # the extractor Epoch's scorer calls. Epoch used gemini-2.0-flash-001 (25 logs,
  # since retired from OpenRouter) and gpt-5-mini-2025-08-07 (12 logs); this is
  # the surviving one.
  grader:
    package: openai
    name: openai
    items:
      - name: openrouter/openai/gpt-5-mini
runner:
  environment:
    INSPECT_ACTION_RUNNER_REFRESH_URL: ""
  secrets:
    - name: OPENROUTER_API_KEY
      description: OpenRouter key for the auditor model and the replayed extractor

limit: 10          # pilot; the dataset is 100
epochs: 1
token_limit: 4000000
time_limit: 3600
retry_attempts: 1
