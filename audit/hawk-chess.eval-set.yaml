# Audit Epoch AI's Chess Puzzles on Hawk.
#
# General: inspect_audit (the auditor cell, tools, grade, concordance, verdicts) and
# its one published auditor image. Bespoke: this file and the epoch-bench task
# package -- the chess engine is installed by the `setup` script at sample start
# and the `notes` tell the auditor to use it.
name: audit-epoch-chess

packages:
  - git+https://github.com/Generality-Labs/inspect_audit@grade-reset
  - git+https://github.com/Generality-Labs/epoch_bench

tasks:
  - package: git+https://github.com/Generality-Labs/inspect_audit@grade-reset
    name: inspect_audit
    items:
      - name: audit
        args:
          task: bench/Chess Puzzles
          # Epoch's 38 public logs; the manifest is fetched by the (trusted) runner
          logs: https://raw.githubusercontent.com/Generality-Labs/epoch_bench/main/audit/logs.csv
          items: [gold-answer, insufficiently-specified, answer-format, red-teaming, other-findings]
          setup: >-
            apt-get update -qq && apt-get install -y -qq --no-install-recommends stockfish
            && pip install -q --no-cache-dir python-chess
          notes: |
            The gold move was produced by a chess engine (benchmark/puzzle_generator.py
            has the generation criteria: best move at depth 18, second-best at least
            180 centipawns worse). Judge moves by engine search, not by eye: stockfish
            is at /usr/games/stockfish and python-chess is installed.
          auditor_image: ghcr.io/generality-labs/inspect-audit-auditor:0.2

# own OpenRouter key, straight to the provider, no middleman
models:
  - package: openai
    name: openai
    items:
      - name: openrouter/openai/gpt-5.6-luna
model_roles:
  # the extractor Epoch's scorer calls; 25 of 38 logs used gemini-2.0-flash-001
  # (12 used gpt-5-mini-2025-08-07). Concordance replays against this one.
  grader:
    package: openai
    name: openai
    items:
      - name: openrouter/google/gemini-2.0-flash-001
runner:
  environment:
    INSPECT_ACTION_RUNNER_REFRESH_URL: ""
  secrets:
    - name: OPENROUTER_API_KEY
      description: OpenRouter key for the auditor model and the replayed extractor

limit: 10          # pilot
epochs: 1
token_limit: 4000000
time_limit: 3600
retry_attempts: 1
