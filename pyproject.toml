[project]
name = "epoch-bench"
version = "0.1.0"
description = "Inspect ports of published benchmarks and graders for auditing"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.266"]

[project.entry-points.inspect_ai]
bench = "bench._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
include = ["bench/task/chess_puzzles/puzzles.csv", "bench/task/dtbench/questions.json", "bench/task/dtbench/source_data.zip", "bench/task/dtbench/UPSTREAM_LICENSE.txt"]
