[project]
name = "epoch-bench"
version = "0.1.0"
description = "Epoch AI's Chess Puzzles task, reconstructed from their published source and logs, for auditing"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.152"]

[project.entry-points.inspect_ai]
bench = "bench._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
include = ["bench/task/chess_puzzles/puzzles.csv"]
